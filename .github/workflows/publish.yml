name: Publish to npm

# Publishes lemma-mcp through npm trusted publishing (OIDC): no npm token is stored
# anywhere. The npm package settings trust this exact file name (publish.yml) in
# xenitV1/lemma. Runs when a GitHub release is published, or by hand for a version
# whose release already exists.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Skip if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "lemma-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "lemma-mcp@$VERSION is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
